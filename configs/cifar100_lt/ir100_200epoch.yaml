dataset: CIFAR100-LT
source: official_cifar100_python_archive
imbalance_ratio: 100
classes: 100
epochs: 200
batch_size: 128
seeds: [3407, 3408, 3409]
optional_replication_seeds: [3410, 3411]
model_depth: 32
model_width: 16
augmentation: zero

# These four arms use the same CIFAR-100-LT construction, optimizer family,
# batch size, augmentation, schedule, and evaluation protocol.
baseline_arms: [erm, balanced_softmax, ldam_drw, logit_adjustment]
execution: fused
learning_rate: 0.1
weight_decay: 0.0002
momentum: 0.9
schedule: standard_multistep
warmup_epochs: 5
milestones: [160, 180]
ldam_C: 0.5
ldam_scale: 30.0
ldam_beta: 0.9999
ldam_switch_epoch: 160
logit_adjustment_tau: 1.0

# Stage-TRR is run by trr_audited_runner.py with the same data construction.
stage_trr_prefix_epochs: 10
stage_trr_lr_encoder: 0.1
stage_trr_lr_head: 0.05
stage_trr_calibration_fraction: 0.1

# Training writes FIT-only artifacts. The test split is opened only by the
# one-time evaluator after all checkpoints are frozen.
held_policy: freeze_then_single_test_read
